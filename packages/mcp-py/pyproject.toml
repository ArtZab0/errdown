[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "errdown-mcp"
version = "0.1.0a2"
description = "MCP server with a fetch tool that returns content on success and a Cloudflare-compatible structured error (errdown) on failure."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Artem Zabarov" }]
keywords = ["mcp", "fetch", "errors", "rfc9457", "ai-agents"]
dependencies = ["errdown>=0.1.0a2", "mcp>=2.3,<3", "httpx>=0.27", "markdownify>=0.13"]

[project.scripts]
errdown-mcp = "errdown_mcp.server:main"

[project.urls]
Homepage = "https://artzab0.github.io/errdown"
Repository = "https://github.com/ArtZab0/errdown"

[tool.hatch.build.targets.wheel]
packages = ["src/errdown_mcp"]
