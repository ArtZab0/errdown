[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "errdown"
version = "0.1.0a0"
description = "Cloudflare-compatible structured errors (RFC 9457) for every HTTP error your agent hits."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Artem Zabarov" }]
keywords = ["rfc9457", "problem-details", "errors", "ai-agents", "llm", "mcp", "cloudflare", "http"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://artzab0.github.io/errdown"
Repository = "https://github.com/ArtZab0/errdown"

[tool.hatch.build.targets.wheel]
packages = ["src/errdown"]
