# errdown capture lab. All ports bound to localhost only.
services:
  backend:
    image: python:3.13-alpine
    command: python -u /app/app.py
    volumes: ["./backend:/app:ro"]
  nginx:
    image: nginx:1.27-alpine
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:8081:80"]
    depends_on: [backend]
  apache:
    image: httpd:2.4-alpine
    command: sh -c "echo 'Include conf/extra/errdown.conf' >> conf/httpd.conf && httpd-foreground"
    volumes: ["./apache/extra.conf:/usr/local/apache2/conf/extra/errdown.conf:ro"]
    ports: ["127.0.0.1:8082:80"]
    depends_on: [backend]
  caddy:
    image: caddy:2-alpine
    volumes: ["./caddy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    ports: ["127.0.0.1:8083:80"]
    depends_on: [backend]
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    volumes: ["./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro"]
    ports: ["127.0.0.1:8084:80"]
    depends_on: [backend]
  traefik:
    image: traefik:v3.1
    command: ["--entrypoints.web.address=:80", "--providers.file.filename=/etc/traefik/dynamic.yml"]
    volumes: ["./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"]
    ports: ["127.0.0.1:8085:80"]
    depends_on: [backend]
