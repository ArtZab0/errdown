static_resources:
  listeners:
  - address: { socket_address: { address: 0.0.0.0, port_value: 80 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress
          http_filters:
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
          route_config:
            virtual_hosts:
            - name: all
              domains: ["*"]
              routes:
              - match: { path: /ok }
                route: { cluster: backend }
              - match: { path: /upstream500 }
                route: { cluster: backend, prefix_rewrite: /500 }
              - match: { path: /dead }
                route: { cluster: dead }
              - match: { path: /slow }
                route: { cluster: backend, timeout: 2s }
              - match: { path: /forbidden }
                direct_response: { status: 403 }
              - match: { path: /maint }
                direct_response: { status: 503 }
  clusters:
  - name: backend
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: backend
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: backend, port_value: 9000 } } } }] }]
  - name: dead
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: dead
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: backend, port_value: 9999 } } } }] }]
