limit_req_zone $binary_remote_addr zone=one:1m rate=1r/m;
server {
  listen 80;
  client_max_body_size 1k;
  location /ok        { proxy_pass http://backend:9000; }
  location /upstream500 { proxy_pass http://backend:9000/500; }
  location /dead      { proxy_pass http://backend:9999; }
  location /slow      { proxy_pass http://backend:9000/slow; proxy_read_timeout 2s; }
  location /forbidden { deny all; }
  location /limit     { limit_req zone=one nodelay; limit_req_status 429; proxy_pass http://backend:9000/ok; }
  location /maint     { return 503; }
  location /big       { proxy_pass http://backend:9000/ok; }
  location /          { root /usr/share/nginx/html; }
}
