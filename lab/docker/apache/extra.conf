LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
ProxyTimeout 2
LimitRequestBody 1024
<Location /forbidden>
  Require all denied
</Location>
ProxyPass /ok http://backend:9000/ok
ProxyPass /upstream500 http://backend:9000/500
ProxyPass /dead http://backend:9999/
ProxyPass /slow http://backend:9000/slow
ProxyPass /big http://backend:9000/ok
