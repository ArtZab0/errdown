name: ci
on: [push, pull_request]
jobs:
  js:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/js } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
  py:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.10", "3.13"] }
    defaults: { run: { working-directory: packages/py } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python tests/test_conformance.py
  fixtures-in-sync:
    # expected/rendered files must be regenerated whenever the TS reference changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: cd packages/js && npm ci && node scripts/gen-expected.ts && git diff --exit-code ../../fixtures
